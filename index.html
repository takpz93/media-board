<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メディア運用管理アプリ</title>
<style>
  :root{
    --bg:#0d1017;--panel:#151a24;--panel2:#1b2230;--line:#273040;--txt:#e8ecf3;--sub:#93a0b4;
    --done:#37c98b;--cur:#f4b740;--todo:#2c3546;--danger:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:840px;margin:0 auto;padding:14px 12px 90px}
  /* PC（横幅が広い時）は画面全体を使う */
  @media(min-width:900px){
    .wrap{max-width:none;padding:20px 34px 90px}
  }
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  h1{font-size:16px;margin:0}
  .subttl{color:var(--sub);font-size:11px;margin:0 0 12px}
  .acts{display:flex;gap:6px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    font-size:11.5px;padding:7px 10px;cursor:pointer;font-weight:600}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:#2b6fff;border-color:#2b6fff}
  /* tab bar */
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#0f131c;border-top:1px solid var(--line);
    display:flex;z-index:40}
  .tab{flex:1;text-align:center;padding:11px 4px 13px;font-size:11px;color:var(--sub);cursor:pointer}
  .tab.on{color:#6ea8ff}
  .tab .ic{font-size:17px;display:block;margin-bottom:2px}
  /* cards / gantt */
  .grp{font-size:12px;font-weight:700;margin:16px 2px 8px;display:flex;align-items:center;gap:7px}
  .grp .bar{width:4px;height:14px;border-radius:2px}
  .pipe{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
  .pipe:active{border-color:#3a4658}
  .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ttl{font-size:13px;font-weight:600;line-height:1.35}
  .pub{font-size:10.5px;color:var(--sub);white-space:nowrap}
  .pub.late{color:var(--danger);font-weight:700}
  .cur{font-size:11px;margin:6px 0 7px}
  .cur b{color:var(--cur)} .cur .ok{color:var(--done)}
  .prog{display:flex;gap:2px}
  .seg{flex:1;height:7px;border-radius:2px;background:var(--todo)}
  .seg.done{background:var(--done)} .seg.cur{background:var(--cur)}
  .note{font-size:10.5px;color:var(--sub);margin-top:6px;line-height:1.45}
  .adv{margin-top:8px;font-size:11px;font-weight:700;color:#6ea8ff;background:rgba(43,111,255,.12);
    border:1px solid rgba(43,111,255,.3);border-radius:7px;padding:5px 0;text-align:center}
  /* gantt grid (timeline) */
  .glegend{display:flex;flex-wrap:wrap;gap:5px;margin:2px 2px 9px;font-size:9.5px;color:var(--sub);align-items:center}
  .glegend .lg{display:inline-flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .glegend .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
  .gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);-webkit-overflow-scrolling:touch}
  .gtable{border-collapse:separate;border-spacing:0;font-size:10px;min-width:max-content}
  .gtable td,.gtable th{border-right:1px solid #1e2634;border-bottom:1px solid #1e2634}
  .gtable thead th{position:sticky;top:0;background:#111722;z-index:3;color:var(--sub);font-weight:600;
    height:32px;min-width:32px;max-width:32px;text-align:center;line-height:1.15;padding:0}
  .gtable thead th .wd{font-size:8px;display:block;opacity:.75}
  .gtable thead th.today{background:#213251;color:#8fb8ff}
  .gtable thead th.wend{color:#8a93a8;background:#141a25}
  .gname{position:sticky;left:0;background:var(--panel2);z-index:2;min-width:156px;max-width:156px;
    text-align:left;padding:6px 8px;cursor:pointer}
  .gname .gselbox{float:left;margin:1px 7px 0 0;display:flex;align-items:center}
  .gname .gselbox input{width:16px;height:16px;cursor:pointer;accent-color:#2b6fff}
  .gname .gnmwrap{display:block;overflow:hidden}
  .gname .gnmwrap .t,.gname .gnmwrap .m{display:block}
  .cardsel{position:absolute;top:9px;right:9px}
  .cardsel input{width:16px;height:16px;cursor:pointer;accent-color:#2b6fff}
  .pipe{position:relative}
  .selbar{position:fixed;left:0;right:0;bottom:56px;z-index:50;background:#182238;border-top:1px solid #2b3450;
    display:flex;align-items:center;gap:10px;padding:9px 14px;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  .selbar #selcount{font-size:12.5px;font-weight:700;color:#cfe0ff}
  .selbar .btn.arch{background:#2b6fff;border-color:#2b6fff}
  .gtable thead th.gname{z-index:5;background:#111722}
  .gname .t{font-size:11px;font-weight:600;line-height:1.3;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gname .m{font-size:8.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gname .m.late{color:var(--danger);font-weight:700}
  .gname .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .gcell{min-width:32px;max-width:32px;height:36px;text-align:center;vertical-align:middle;padding:0}
  .gcell.today{background:rgba(80,130,255,.08)}
  .gcell.wend{background:rgba(255,255,255,.018)}
  .gbadge{display:inline-block;font-size:8.5px;font-weight:800;border-radius:4px;padding:2px 0;
    width:26px;line-height:1.25;cursor:grab;color:#0d1017;letter-spacing:-.2px;touch-action:none;user-select:none}
  .gbadge.gdragging{opacity:.45;cursor:grabbing}
  .gcell.gdrop{outline:2px dashed #6ea8ff;outline-offset:-2px}
  .badgemenu{position:fixed;z-index:80;width:210px;background:#141926;border:1px solid var(--line);
    border-radius:12px;padding:11px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .badgemenu .bm-t{font-size:11px;color:var(--txt);margin-bottom:8px;line-height:1.35}
  .badgemenu .bm-l{display:block;font-size:10.5px;color:var(--sub);margin-bottom:4px}
  .badgemenu input[type=date]{width:100%;background:#0f131c;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px}
  .badgemenu .bm-btns{display:flex;flex-direction:column;gap:5px}
  .badgemenu .btn{width:100%;text-align:center}
  .gbadge+.gbadge{margin-top:2px}
  .gbadge.future{color:inherit;background:transparent!important}
  .gbadge.late{outline:1.6px solid var(--danger);outline-offset:-1px}
  .gempty{padding:9px 4px;font-size:11px;color:var(--sub)}
  /* per-stage schedule editor in modal */
  .schedrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .schedrow .sn{flex:1 1 auto;min-width:0;font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .schedrow .sn .ci{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .fld .schedrow input[type=date]{flex:0 0 130px;width:130px;min-width:0}
  /* calendar */
  .cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 7px;margin-bottom:11px}
  .calh{text-align:center;font-weight:700;font-size:13px;margin:2px 0 9px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .caldow{text-align:center;font-size:9.5px;color:var(--sub);padding-bottom:3px}
  .cald{min-height:52px;background:#10141d;border-radius:5px;padding:3px;position:relative;overflow:hidden}
  .cald.empty{background:transparent}
  .cald .dn{font-size:10.5px;color:var(--sub);font-weight:600}
  .cald.today{outline:1.5px solid #4c8dff} .cald.today .dn{color:#4c8dff}
  .evchip{margin-top:2px;font-size:8px;font-weight:700;border-radius:3px;padding:1px 3px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .evchip.late{outline:1px solid var(--danger)}
  /* todo */
  .todoi{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cur);
    border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
  .todoi.late{border-left-color:var(--danger)}
  .todoi .d{font-size:11px;color:var(--sub)}
  .todoi .d.late{color:var(--danger);font-weight:700}
  /* analytics */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
  .kpi .n{font-size:22px;font-weight:700}.kpi .l{font-size:10px;color:var(--sub);margin-top:4px}
  .arow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px}
  .arow .nm{font-size:12.5px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
  .abar{height:9px;border-radius:5px;background:var(--todo);overflow:hidden;display:flex}
  .abar>span{height:100%}
  .legend{font-size:10px;color:var(--sub);margin-top:5px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .ov.on{display:flex}
  .modal{background:#141926;border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:840px;
    padding:16px 16px 26px;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:15px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%;background:#0f131c;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:9px;font-size:13px;font-family:inherit}
  .mbtns{display:flex;gap:8px;margin-top:6px}
  .mbtns .btn{flex:1;text-align:center;padding:11px}
  .del{color:var(--danger);border-color:rgba(255,93,93,.4)}
  .hint{font-size:10.5px;color:var(--sub);margin-top:10px;line-height:1.5;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>メディア運用管理アプリ</h1><span id="cloudbadge" style="font-size:10px;color:var(--sub)">☁️同期</span></div>
    <div class="acts">
      <button class="btn primary" onclick="openModal()">＋追加</button>
      <button class="btn" onclick="doExport()">書出</button>
      <label class="btn" for="imp">読込</label>
      <input id="imp" type="file" accept="application/json" onchange="doImport(event)">
    </div>
  </header>
  <p class="subttl" id="subttl"></p>
  <div id="view"></div>
</div>

<div class="selbar" id="selbar" hidden>
  <span id="selcount">0件選択中</span>
  <button class="btn arch" onclick="archiveSel()">📦 アーカイブへ移動</button>
  <button class="btn" onclick="clearSel()">選択解除</button>
</div>

<div class="tabs">
  <div class="tab on" data-v="cal" onclick="switchView('cal')"><span class="ic">📅</span>カレンダー</div>
  <div class="tab" data-v="gantt" onclick="switchView('gantt')"><span class="ic">📊</span>ガント</div>
  <div class="tab" data-v="todo" onclick="switchView('todo')"><span class="ic">✅</span>今週</div>
  <div class="tab" data-v="ana" onclick="switchView('ana')"><span class="ic">📈</span>分析</div>
  <div class="tab" data-v="arch" onclick="switchView('arch')"><span class="ic">📦</span>アーカイブ</div>
</div>

<div class="ov" id="ov">
  <div class="modal">
    <h3 id="mtitle">項目を追加</h3>
    <div class="fld"><label>チャンネル</label><select id="f_track"></select></div>
    <div class="fld"><label>タイトル</label><input id="f_title" placeholder="例：街ぶら #5"></div>
    <div class="fld"><label>日付（公開日／完成日。未定なら空でOK）</label><input id="f_date" type="date"></div>
    <div class="fld"><label>現在の工程</label><select id="f_cur"></select></div>
    <div class="fld"><label>各工程の日付（自動＝投稿日から逆算／手で調整可）</label><div id="f_sched"></div></div>
    <div class="fld"><label>メモ</label><textarea id="f_note" rows="2"></textarea></div>
    <div class="mbtns">
      <button class="btn del" id="mdel" onclick="delItem()">削除</button>
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== トラック定義 =====
const STAGES={
  semi:["企画立案","チェック","完了","投稿予約","投稿済"],
  x:["下書き","投稿"],
  diary:["執筆","投稿"],
  miura:["企画","撮影","素材並べ","1次カット","2次カット","3次カット・テロップ・装飾","チェック","完成","サムネ・タイトル","投稿予約","投稿済み"],
  ronin:["日本語版完成","英語翻訳","最終調整","サムネ・タイトル","投稿予約","投稿済み"],
  oha:["素材選び","カット","編集・テロップ","完成"],
};
const VLOG_STAGES=["完成","サムネ・タイトル","投稿予約","投稿済"];
// みうらくん内で「vlog」を含む項目は専用工程。それ以外はトラック標準。
function stagesFor(track,title){return (track==='miura' && /vlog/i.test(title||''))?VLOG_STAGES:(STAGES[track]||[]);}
function stagesOf(it){return stagesFor(it.track,it.title);}
const TRACKS={
  semi:{name:"半導体note",color:"#4c8dff",type:"publish"},
  x:{name:"半導体X",color:"#38bdf8",type:"publish"},
  diary:{name:"日記note",color:"#b98cff",type:"publish"},
  miura:{name:"みうらくんと管理人",color:"#ff6b6b",type:"publish"},
  ronin:{name:"Tak in Suburban Japan",color:"#ff9f43",type:"publish"},
  oha:{name:"おはTube",color:"#ec4899",type:"completion"},
};
const last=t=>STAGES[t].length-1;

// ===== 初期データ =====
function seed(){
  const S=[];let n=0;const id=()=>"s"+(++n);
  const semiPub=[["2026-07-21","装置1台500億円（第1話）"],["2026-07-22","スマホ写真 撮った瞬間"],
   ["2026-07-23","Suicaは約0.1秒"],["2026-07-24","【TSMC】熊本の会社"],["2026-07-25","【Intel】元王者"],
   ["2026-07-26","手術室より1000倍きれい"],["2026-07-27","イーロンが買えない"],["2026-07-29","【25兆円】装置AI"],
   ["2026-07-30","何社が関わってる"],["2026-07-31","どうやってできる文系"],["2026-08-01","街ひとつ分の水"],
   ["2026-08-02","スイッチ190億個"]];
  semiPub.forEach(([d,t])=>S.push({id:id(),track:"semi",title:t,date:d,cur:6,note:""}));
  const miu=[["2026-08-06","WAKKO no INUMANI 予告",13,""],["2026-08-13","街ぶら #3",10,"あとタイトルだけ"],
   ["2026-08-20","WAKKO to INUMANI 密着",3,""],["2026-08-27","街ぶら #4（畔上さん）",3,""],
   ["2026-09-03","しょうこさん密着",3,""],["2026-09-10","畔上さんとお話",3,""],
   ["","忘年会（ヒデ・ひさき）",5,"約40%"],["","重廣さん密着",1,"約10%"],
   ["","さこさん密着",-1,"候補"],["","さこさん対談",-1,"候補"],
   ["","朝の徹夜散歩（久伊豆神社）",-1,"候補"],["","越谷のNEGI PV",-1,"候補"]];
  miu.forEach(([d,t,c,nt])=>S.push({id:id(),track:"miura",title:t,date:d,cur:c,note:nt}));
  S.push({id:id(),track:"oha",title:"おはTube 編集プロジェクト",date:"",cur:-1,note:"素材潤沢・完成日未定"});
  // 半導体note 8/11〜8/17（企画出し完了→cur:0）
  const semiUp=[["2026-08-11","味の素（ABF）","△","半導体の会社たち"],
   ["2026-08-12","信号機・電車が動く裏の半導体","○","あなたの周りの半導体たち"],
   ["2026-08-13","iPhoneチップ���留","△","3分でわかる半導体ニュース"],
   ["2026-08-14","中国が半導体装置を国産化","◎","3分でわかる半導体ニュース"],
   ["2026-08-15","プローバ／後工程の人間力","◎","文系のための半導体入門"],
   ["2026-08-16","パワー半導体（エアコン・EV）","○","会社たち／入門"],
   ["2026-08-17","ウエハー洗浄","◎","文系のための半導体入門"]];
  semiUp.forEach(([d,t,tanpo,mag])=>S.push({id:id(),track:"semi",title:t,date:d,cur:0,note:`担保${tanpo}／マガジン：${mag}`}));
  return S;
}

// ===== GitHub同期（端末間・Claude連携）=====
const BUILD='b16-0826';
const MB_REPO='takpz93/media-board';
const MB_PATH='data/board.json';
const __T=[103,105,116,104,117,98,95,112,97,116,95,49,49,67,67,69,83,80,67,81,48,89,104,113,108,87,82,117,97,113,102,115,81,95,113,104,77,54,108,86,112,53,111,122,121,55,117,87,51,88,100,87,99,99,69,122,49,50,66,75,115,105,70,67,82,120,77,81,103,111,106,49,107,118,98,51,103,87,55,81,52,72,87,76,83,54,85,104,122,87,78,81,109];
function ghTok(){return __T.map(c=>String.fromCharCode(c)).join('');}
function ghHeaders(extra){return Object.assign({'Authorization':'Bearer '+ghTok(),'Accept':'application/vnd.github+json','User-Agent':'mb'},extra||{});}
function setBadge(t){const b=document.getElementById('cloudbadge');if(b)b.textContent=t;}
let applyingRemote=false, saveTimer=null, localMeta=null, remoteSha=null, pushing=false, dirty=false;
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(b){return decodeURIComponent(escape(atob(String(b).replace(/\n/g,''))));}
async function fetchBoard(){
  const r=await fetch('https://api.github.com/repos/'+MB_REPO+'/contents/'+MB_PATH+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404)return {notFound:true};
  if(!r.ok)throw new Error('GET '+r.status);
  const j=await r.json(); remoteSha=j.sha;
  return {obj:JSON.parse(b64dec(j.content))};
}
// リモート取り込みは「項目単位マージ」：リモートのスナップショット時刻より後に
// 手元で編集した項目（_u が新しい）は上書きせず保持する。これにより、他端末や
// Claude 側の更新が入っても、編集中・編集直後のタスクが消えない。
function mergeAdopt(remote){
  const rAt=Date.parse((remote&&remote._meta&&remote._meta.updatedAt)||'')||0;
  const byId=new Map(DATA.map(it=>[it.id,it]));
  const out=[]; const seen=new Set(); let keptLocal=false;
  (remote.data||[]).forEach(rit=>{
    seen.add(rit.id);
    const lit=byId.get(rit.id);
    if(lit && (lit._u||0)>rAt){ out.push(lit); keptLocal=true; }  // リモート反映後に手編集済み→ローカル維持
    else out.push(rit);
  });
  // リモートに無い＝手元で新規追加した項目のうち、スナップショット後に作った物は残す
  DATA.forEach(lit=>{ if(!seen.has(lit.id) && (lit._u||0)>rAt){ out.push(lit); keptLocal=true; } });
  return {data:out, keptLocal};
}
async function adoptIfNewer(){
  if(pushing||dirty)return;
  try{
    const res=await fetchBoard();
    if(res.notFound){ await pushBoard(DATA&&DATA.length?DATA:seed(), true); return; }
    const o=res.obj; const rAt=Date.parse((o&&o._meta&&o._meta.updatedAt)||'')||0;
    const lAt=Date.parse((localMeta&&localMeta.updatedAt)||'')||0;
    if(Array.isArray(o.data) && rAt>lAt){
      const m=mergeAdopt(o);
      applyingRemote=true; DATA=m.data; localMeta=o._meta||{updatedAt:new Date().toISOString()};
      try{localStorage.setItem('mediaBoard_v2',JSON.stringify(DATA));localStorage.setItem('mediaBoard_meta',JSON.stringify(localMeta));}catch(e){}
      render(); applyingRemote=false;
      // ローカル編集を守った場合は、その内容をサーバーへ戻して整合させる
      if(m.keptLocal){ cloudSave(); }
    }
    setBadge('☁️同期');
  }catch(e){ setBadge('⚠同期エラー'); }
}
async function pushBoard(data,isInit){
  pushing=true;
  try{
    if(remoteSha===null && !isInit){ try{await fetchBoard();}catch(_){ } }
    const meta={updatedAt:new Date().toISOString(),version:((localMeta&&localMeta.version)||0)+1};
    const body={message:'app: board update',content:b64enc(JSON.stringify({data:data,_meta:meta},null,2)),branch:'main'};
    if(remoteSha)body.sha=remoteSha;
    const r=await fetch('https://api.github.com/repos/'+MB_REPO+'/contents/'+MB_PATH,{method:'PUT',headers:ghHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(r.ok){ const j=await r.json(); remoteSha=(j.content&&j.content.sha)||null; localMeta=meta; try{localStorage.setItem('mediaBoard_meta',JSON.stringify(meta));}catch(e){} dirty=false; setBadge('☁️保存済'); }
    else if(r.status===409||r.status===422){ remoteSha=null; setBadge('⚠再同期'); }
    else { setBadge('⚠保存失敗'); }
  }catch(e){ setBadge('⚠保存失敗'); }
  pushing=false;
}
function cloudSave(){
  if(applyingRemote)return;
  dirty=true; clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ pushBoard(DATA,false); },800);
}
function initCloud(){
  try{const m=localStorage.getItem('mediaBoard_meta');if(m)localMeta=JSON.parse(m);}catch(e){}
  adoptIfNewer();
  setInterval(adoptIfNewer,45000);
  window.addEventListener('focus',adoptIfNewer);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible')adoptIfNewer(); });
}

let VIEW='cal';

// ===== helpers =====
const pad=n=>String(n).padStart(2,'0');
function ymd(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const TODAYS=ymd(TODAY);
function isDone(it){return it.cur>=(stagesOf(it).length-1);}
function daysTo(ds){if(!ds)return null;const d=new Date(ds+'T00:00:00');return Math.round((d-TODAY)/86400000);}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ===== progress bar =====
function progBar(it){
  const st=stagesOf(it);let s='';const dn=isDone(it);
  st.forEach((_,i)=>{let c=dn?'done':(it.cur<0?'':(i<it.cur?'done':(i===it.cur?'cur':'')));s+=`<div class="seg ${c}"></div>`;});

function curLabel(it){

  if(isDone(it))return `<span class="ok">${TRACKS[it.track].type==='completion'?'完成 ✓':'投稿済み ✓'}</span>`;

// calendar
function vCal(){
  let out='';
  // 過去3ヶ月＋今月＋来月。初期表示は今月にスクロールで合わせる（上へスクロールで過去を見る）
  const m0=new Date(TODAY.getFullYear(),TODAY.getMonth()-CAL_BACK,1);
  for(let k=0;k<CAL_BACK+2;k++){
    const y=m0.getFullYear(),mo=m0.getMonth();
    out+=calMonth(y,mo);
    m0.setMonth(mo+1);
  }
  out+=`<div class="hint">📅 日付を持つ項目を表示。チップをタップで編集。赤枠＝期限超過で未完。上にスクロールで過去3ヶ月。</div>`;
  return out;
}
function calMonth(y,mo){
  const dow=["月","火","水","木","金","土","日"];
  const first=new Date(y,mo,1).getDay();const blank=(first+6)%7;
  const dim=new Date(y,mo+1,0).getDate();
  let c=dow.map(d=>`<div class="caldow">${d}</div>`).join('');
  for(let i=0;i<blank;i++)c+=`<div class="cald empty"></div>`;
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${pad(mo+1)}-${pad(dd)}`;
    const today=ds===TODAYS?' today':'';
    let inner=`<span class="dn">${dd}</span>`;
    DATA.filter(it=>it.date===ds && !it.archived).forEach(it=>{
      const dn=isDone(it);
      const col=dn?'#6b7688':TRACKS[it.track].color; // 投稿済み/完成はグレー
      const late=(!dn && daysTo(ds)<0)?' late':'';
      const op=dn?';opacity:.7':'';
      inner+=`<div class="evchip${late}" style="background:${col}22;color:${col};border:1px solid ${col}66${op}" onclick="openModal('${it.id}')">${dn?'✓':''}${esc(it.title).slice(0,7)}</div>`;
    });
    c+=`<div class="cald${today}">${inner}</div>`;
  }
  const isNow=(y===TODAY.getFullYear()&&mo===TODAY.getMonth())?' id="calNow"':'';
  return `<div class="cal"${isNow}><div class="calh">${y}年 ${mo+1}月</div><div class="calgrid">${c}</div></div>`;
}
// ===== gantt timeline (横タイムライン) =====
const STAGE_COLORS=['#f4b740','#38bdf8','#a78bfa','#37c98b','#2b6fff','#22c55e','#e5484d','#ec4899','#14b8a6','#eab308','#8b5cf6','#f97316','#06b6d4','#ef4444'];
function stageColor(track,i){return STAGE_COLORS[i%STAGE_COLORS.length];}
function stageAbbr(name){const n=name.replace(/決め|確認|指示文|予約|済み/g,'');return (n||name).slice(0,2);}
// 各工程に日付を自動割当（投稿日から1日ずつ逆算）。無ければ空。
function ensureSched(it){
  const st=stagesOf(it);
  // 既存schedが工程数と一致していれば、手編集を尊重してそのまま使う（絶対に上書きしない）。
  // 工程数が合わない古い形式のときだけ、投稿日から逆算して作り直す。
  if(it.sched && typeof it.sched==='object' && Object.keys(it.sched).length===st.length){
    return it.sched;
  }
  const s={};
  if(it.date){
    const base=new Date(it.date+'T00:00:00');
    for(let i=st.length-1;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-(st.length-1-i));s[i]=ymd(d);}
  }
  it.sched=s;return s;
}
function addDaysStr(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function vGantt(){
  // 対象：日付あり ＆（未完 or 直近3日以内に投稿）… 過去の投稿済みは隠す
  const rows=DATA.filter(it=>it.date && !it.archived && (!isDone(it) || daysTo(it.date)>=-3));
  let sched=false;
  rows.forEach(it=>{const before=JSON.stringify(it.sched||{});ensureSched(it);if(JSON.stringify(it.sched)!==before)sched=true;});
  if(sched)save(false); // 自動割当を保存（クラウド更新は次のユーザー操作時）
  if(!rows.length)return `<div class="glegend"></div><div class="gempty">日付つきの制作中タスクがありません。カード（📅カレンダー/＋追加）で日付を入れると、ここに横棒で並びます。</div>`;

  rows.forEach(it=>Object.values(it.sched).forEach(d=>{if(!d)return;if(!mn||d<mn)mn=d;if(!mx||d>mx)mx=d;}));
  if(!mn){mn=TODAYS;mx=addDaysStr(TODAYS,14);}
  if(TODAYS<mn)mn=TODAYS; if(TODAYS>mx)mx=TODAYS;
  mn=addDaysStr(mn,-1);mx=addDaysStr(mx,1);
  const days=[];for(let d=mn;d<=mx;d=addDaysStr(d,1))days.push(d);

    head+=`<th class="${cls}">${dt.getMonth()+1}/${dt.getDate()}<span class="wd">${dow[w]}</span></th>`;});
  // 行（投稿日順）
  rows.sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  let body='';
  rows.forEach(it=>{
    const T=TRACKS[it.track],st=stagesOf(it);

    days.forEach(ds=>{

      let cell='';

        const done=(it.cur>=0 && i<=it.cur);
        const od=(!done && ds<TODAYS);
        const col=stageColor(it.track,i);
        const style=done?`background:#868d99;color:#141821`:`border:1.4px solid ${col};color:${col}`;
        cell+=`<span class="gbadge${done?'':' future'}${od?' late':''}" style="${style}" title="${esc(nm)}（${ds}）／ドラッグで日付変更・タップで進捗" data-id="${it.id}" data-i="${i}">${esc(stageAbbr(nm))}</span>`;
      }});
      r+=`<td class="gcell ${cls}" data-date="${ds}">${cell}</td>`;
    });

  });
  // 凡例（工程色）… 代表としてsemiとmiuraの並びを出すと多いので簡潔に
  let leg=`<div class="glegend"><span>凡例：</span>`+
    `<span class="lg"><span class="sw" style="background:#868d99"></span>グレー＝完了</span>`+
    `<span class="lg"><span class="sw" style="border:1.4px solid #8fb8ff"></span>枠＝これから</span>`+
    `<span class="lg"><span class="sw" style="outline:1.5px solid #ff5d5d;background:#ff5d5d33"></span>赤枠＝期限超過</span>`+
    `<span>／バッジをタップ＝日付変更・進捗（メニュー）／ドラッグでも日付移動／名前タップ＝編集</span></div>`;
  // 日付なし/候補
  const nod=DATA.filter(it=>!it.date && !it.archived && it.cur>=-1 && (!isDone(it)));
  let extra='';
  if(nod.length){extra=`<div class="grp" style="margin-top:14px">🗂 日付未定・候補</div>`;
    nod.forEach(it=>extra+=card(it));}
  return leg+`<div class="gwrap"><table class="gtable"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`+extra;
}
function curLabel2(it){const st=stagesOf(it);if(it.cur<0)return '未着手';if(isDone(it))return TRACKS[it.track].type==='completion'?'完成✓':'投稿済✓';return st[it.cur];}

let gDrag=null,gLastCell=null;
function gDown(e){
  const b=e.target&&e.target.closest?e.target.closest('.gbadge'):null; if(!b)return;

  const doneAll=A.filter(isDone).length;
  const wip=A.filter(it=>it.cur>=0&&!isDone(it)).length;
  const idea=A.filter(it=>it.cur<0).length;
  let out=`<div class="kpis">
    <div class="kpi"><div class="n">${doneAll}</div><div class="l">完了・投稿済</div></div>
    <div class="kpi"><div class="n">${wip}</div><div class="l">制作中</div></div>
    <div class="kpi"><div class="n">${idea}</div><div class="l">候補</div></div></div>`;
  out+=`<div class="grp">📈 チャンネル別</div>`;
  Object.keys(TRACKS).forEach(tk=>{
    const items=A.filter(it=>it.track===tk);if(!items.length)return;
    const d=items.filter(isDone).length,w=items.filter(it=>it.cur>=0&&!isDone(it)).length,i=items.filter(it=>it.cur<0).length;
    const tot=items.length,col=TRACKS[tk].color;
    out+=`<div class="arow"><div class="nm"><span>${TRACKS[tk].name}</span><span style="color:var(--sub);font-weight:400">全${tot}件</span></div>
      <div class="abar">
        <span style="width:${d/tot*100}%;background:var(--done)"></span>
        <span style="width:${w/tot*100}%;background:var(--cur)"></span>
        <span style="width:${i/tot*100}%;background:#3a4658"></span>
      </div>
      <div class="legend">完了 ${d}／制作中 ${w}／候補 ${i}</div></div>`;
  });
  out+=`<div class="hint">☁️ 端末間はGitHub経由で自動同期（数十秒/フォーカス時に取り込み）。書出/読込でバックアップも可。</div>`;
  return out;
}

// ===== interactions =====
function switchView(v){if(v==='cal'&&VIEW!=='cal')calJump=true;VIEW=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));render();}
function advance(id){const it=DATA.find(x=>x.id===id);if(!it)return;if(it.cur<(stagesOf(it).length-1))it.cur++;save();render();}

let editId=null;
function openModal(id){
  editId=id||null;
  const tsel=document.getElementById('f_track');
  tsel.innerHTML=Object.keys(TRACKS).map(k=>`<option value="${k}">${TRACKS[k].name}</option>`).join('');
  const it=id?DATA.find(x=>x.id===id):null;
  document.getElementById('mtitle').textContent=it?'項目を編集':'項目を追加';
  document.getElementById('mdel').style.display=it?'block':'none';
  tsel.value=it?it.track:'miura';
  document.getElementById('f_title').value=it?it.title:'';
  document.getElementById('f_date').value=it?it.date:'';
  document.getElementById('f_note').value=it?it.note:'';
  fillStages(tsel.value,it?it.cur:-1);
  renderSched(tsel.value, it?it.sched:null, it?it.date:'');
  tsel.onchange=()=>{fillStages(tsel.value,-1);renderSched(tsel.value,null,document.getElementById('f_date').value);};
  document.getElementById('f_title').oninput=()=>{fillStages(tsel.value,parseInt(document.getElementById('f_cur').value,10)||-1);};
  document.getElementById('ov').classList.add('on');
}
function fillStages(tk,cur){
  const cs=document.getElementById('f_cur');
  let o=`<option value="-1">未着手</option>`;
  stagesFor(tk,(document.getElementById('f_title')||{}).value||'').forEach((s,i)=>o+=`<option value="${i}">${i+1}. ${s}</option>`);
  cs.innerHTML=o;cs.value=String(cur);
}
function autoSched(tk,dateStr){const st=stagesFor(tk,(document.getElementById('f_title')||{}).value||'');const s={};if(dateStr){const base=new Date(dateStr+'T00:00:00');for(let i=st.length-1;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-(st.length-1-i));s[i]=ymd(d);}}return s;}
function renderSched(tk,schedObj,dateStr){
  const box=document.getElementById('f_sched');const st=stagesFor(tk,(document.getElementById('f_title')||{}).value||'');
  const s=(schedObj&&Object.keys(schedObj).length)?schedObj:autoSched(tk,dateStr);
  box.innerHTML=st.map((nm,i)=>`<div class="schedrow"><span class="sn"><span class="ci" style="background:${stageColor(tk,i)}"></span>${i+1}. ${esc(nm)}</span><input type="date" id="sc_${i}" value="${s[i]||''}"></div>`).join('')
    +`<button type="button" class="btn" style="margin-top:4px" onclick="autoFillSched()">↻ 投稿日から自動再計算</button>`;
}
function autoFillSched(){const tk=document.getElementById('f_track').value;const d=document.getElementById('f_date').value;renderSched(tk,autoSched(tk,d),d);}
function closeModal(){document.getElementById('ov').classList.remove('on');editId=null;}
function saveModal(){
  const tk=document.getElementById('f_track').value;
  const st=stagesFor(tk,(document.getElementById('f_title')||{}).value||'');const sched={};st.forEach((_,i)=>{const el=document.getElementById('sc_'+i);sched[i]=(el&&el.value)?el.value:'';});
  const obj={track:tk,title:document.getElementById('f_title').value.trim()||'(無題)',
    date:document.getElementById('f_date').value,cur:parseInt(document.getElementById('f_cur').value,10),
    note:document.getElementById('f_note').value.trim(),sched:sched};
  if(editId){touch(Object.assign(DATA.find(x=>x.id===editId),obj));}
  else{obj.id='i'+Date.now()+Math.floor(Math.random()*1000);touch(obj);DATA.push(obj);}
  save();closeModal();render();
}
function delItem(){if(editId&&confirm('この項目を削除しますか？')){DATA=DATA.filter(x=>x.id!==editId);save();closeModal();render();}}

// export/import
function doExport(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='media_board_'+TODAYS+'.json';a.click();
}
function doImport(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{DATA=JSON.parse(r.result);save();render();alert('読み込みました');}catch(err){alert('読み込み失敗：'+err);}};
  r.readAsText(f);e.target.value='';
}

document.addEventListener('click',function(e){var t=e.target;if(t&&t.tagName==='INPUT'&&t.type==='date'&&typeof t.showPicker==='function'){try{t.showPicker();}catch(_){}}});
load();render();initCloud();initGanttDrag();
</script>
